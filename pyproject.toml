[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universalinvoicemail"
version = "2.3.0"
description = "Local-first Windows desktop app for collecting invoices and receipts from email, attachment PDF conversion, private archive and DATEV CSV export."
readme = "README.md"
authors = [
    { name = "Lukas Geiger" }
]
license = { text = "MIT" }
keywords = ["invoice", "email", "imap", "gmail", "datev", "pdf", "accounting", "pyside6", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "PySide6>=6.5.0",
    "keyring>=25.0.0",
    "Pillow>=12.3.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "xhtml2pdf>=0.2.17",
    "reportlab>=4.2.0",
    "pypdfium2>=4.26.0",
    "pytesseract>=0.3.13",
    "pypdf>=5.0.0",
    "docx2pdf>=0.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
gmail = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth>=2.23.0",
]

[project.urls]
Homepage = "https://github.com/doc-bricks/UniversalInvoiceMail"
Repository = "https://github.com/doc-bricks/UniversalInvoiceMail.git"
Issues = "https://github.com/doc-bricks/UniversalInvoiceMail/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]
