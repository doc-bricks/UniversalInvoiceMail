<!doctype html>
<html lang="de">
  <head>
    <link rel="icon" href="./icons/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#255f63">
    <title data-i18n="app_title_page">UniversalInvoiceMail Companion</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow" data-i18n="app_eyebrow">UniversalInvoiceMail</p>
        <h1 data-i18n="app_title">Rechnungsprüfung</h1>
      </div>
      <div class="actions" aria-label="Bundle-Aktionen" data-i18n-aria="actions_aria">
        <select id="lang-select" class="lang-select" aria-label="Sprachauswahl">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="zh">简体中文</option>
          <option value="ja">日本語</option>
          <option value="ru">Русский</option>
        </select>
        <label class="button primary" for="bundle-file" data-i18n="btn_open_bundle">Bundle öffnen</label>
        <input id="bundle-file" type="file" accept="application/json,.json">
        <button id="restore-bundle" class="button" type="button" data-i18n="btn_restore">Letzten Stand</button>
        <button id="clear-bundle" class="button ghost" type="button" data-i18n="btn_clear">Lokalen Stand löschen</button>
        <button id="export-changes" class="button accent" type="button" disabled data-i18n="btn_export_changes">Änderungen exportieren</button>
      </div>
    </header>

    <main>
      <section class="summary" id="summary" aria-live="polite"></section>

      <section class="toolbar" aria-label="Filter" data-i18n-aria="filter_aria">
        <label>
          <span data-i18n="lbl_search">Suche</span>
          <input id="query" type="search" autocomplete="off">
        </label>
        <label>
          <span data-i18n="lbl_profile">Profil</span>
          <select id="profile-filter"></select>
        </label>
        <label>
          <span data-i18n="lbl_status">Status</span>
          <select id="status-filter"></select>
        </label>
      </section>

      <section class="workspace">
        <nav class="invoice-list" id="invoice-list" aria-label="Rechnungen" data-i18n-aria="invoices_aria"></nav>
        <article class="detail">
          <p id="detail-empty" class="empty" data-i18n="detail_empty_bundle">Kein Bundle geladen</p>
          <form id="detail-form" hidden>
            <div class="detail-head">
              <h2 id="detail-title"></h2>
              <p id="detail-meta"></p>
            </div>
            <label>
              <span data-i18n="lbl_amount">Betrag</span>
              <input id="amount" type="text" inputmode="decimal" autocomplete="off">
            </label>
            <label>
              <span data-i18n="lbl_review_status">Prüfstatus</span>
              <select id="review-status"></select>
            </label>
            <label>
              <span data-i18n="lbl_notes">Notiz</span>
              <textarea id="notes" rows="8"></textarea>
            </label>
            <div class="hash-box">
              <span data-i18n="lbl_file_hash">Datei-Hash</span>
              <code id="file-hash"></code>
            </div>
          </form>
        </article>
      </section>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
